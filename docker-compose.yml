# NovaWallet.Ledger.Service — local development stack.
#
# `docker compose up --build` brings up Postgres (the database), Redis
# (optional HybridCache idempotency fast-path — the app degrades gracefully
# without it, but it's included for the full documented behavior), RabbitMQ
# (provisioned by explicit stakeholder request — see note below), and the
# API itself.
#
# RabbitMQ is NOT wired into any running code path yet (no
# ConnectionFactory/publisher/consumer exists for it in the codebase today —
# only OTel trace-context helper classes reference RabbitMQ types, for future
# use). It's included in the default stack anyway per explicit instruction,
# not because the app currently needs it — see AI_USAGE.md's Prompt 2 addendum
# for how this decision evolved from "profile-gated" to "default".
#
# The OpenTelemetry Collector remains genuinely opt-in: the app exports OTLP
# traces/metrics directly and simply no-ops with a logged warning if no
# collector is listening, and pointing it at a real Grafana Cloud tenant
# requires third-party credentials. It stays behind the `observability`
# Compose profile:
#
#   docker compose --profile observability -f docker-compose.yml -f docker-compose.observability.yml up --build
#
# All secrets/config below come from `.env` (git-ignored; see `.env.example`
# for the tracked template). Values shipped in this repo's own `.env` are
# dev-only placeholders, safe to commit-adjacent since they're not real secrets.
#
# NOTE: migrations for the `WalletTransfer` and `LedgerSnapshot` tables have
# not been hand-authored yet (see README). Against a fresh volume, `POST
# /api/v1/wallets/transfer` and the ReconciliationWorker will fail until those
# migrations are added — deposits and wallet creation/reads work end-to-end.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-novawallet}
      POSTGRES_USER: ${POSTGRES_USER:-novawallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - novawallet-postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-novawallet} -d ${POSTGRES_DB:-novawallet}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-novawallet}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/NovaWallet.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Development triggers Program.cs's app.ApplyDatabaseMigrationsAsync() on boot.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      NOVAWALLET_LEDGER_CONNECTION_STRING: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-novawallet};Username=${POSTGRES_USER:-novawallet};Password=${POSTGRES_PASSWORD}"
      REDIS_URI: "redis:6379,password=${REDIS_PASSWORD}"
      Jwt__SecretKey: ${Jwt__SecretKey}
      Jwt__Issuer: ${Jwt__Issuer:-NovaWallet.Ledger.Service}
      Jwt__Audience: ${Jwt__Audience:-NovaWallet.Ledger.Clients}
      Jwt__TokenExpirationTimeInMinutes: ${Jwt__TokenExpirationTimeInMinutes:-60}
    ports:
      - "${API_HTTP_PORT:-5000}:8080"

volumes:
  novawallet-postgres-data:
