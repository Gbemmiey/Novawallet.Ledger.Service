# Optional overlay adding the OpenTelemetry Collector from README
# §"Technical Stack" — NOT required for the core deliverable and NOT
# consumed by any running code path today (see docker-compose.yml's header
# comment for why). RabbitMQ now lives in the default stack (docker-compose.yml)
# per explicit stakeholder request, so it no longer appears here. Bring the
# collector up alongside the core stack with:
#
#   docker compose --profile observability -f docker-compose.yml -f docker-compose.observability.yml up --build
#
# This overlay exists (rather than folding the collector straight into
# docker-compose.yml) so the `api` service's ObservabilityOptions__ExporterUri
# can be pointed at the collector's Compose-network hostname only when the
# collector is actually present — Compose has no native "env var differs by
# profile on the same service" mechanism, so a merged override file is the
# cleanest way to do that without duplicating the whole `api` service definition.
# ExporterUri itself is fully env-driven (OBSERVABILITY_EXPORTER_URI in .env),
# defaulting to the collector's Compose-network hostname so no edit is needed
# for the common case, but repointable (e.g. at a Grafana Alloy/Agent, or a
# differently-named collector) without touching this file.

services:
  # Deliberately no `depends_on: otel-collector` here: Compose starts a
  # dependency even if it's profile-gated and the profile wasn't requested, so
  # adding one would force otel-collector to always start just because this
  # override file is merged in. The OTLP exporter is async/non-blocking on
  # connection failure (logs a warning, doesn't crash startup), so no startup
  # ordering is required — `api` simply won't find anything at this address
  # until the `observability` profile is actually activated.
  api:
    environment:
      ObservabilityOptions__ExporterUri: ${OBSERVABILITY_EXPORTER_URI:-http://otel-collector:4317}

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles: ["observability"]
    volumes:
      - ./ops/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT}
      GRAFANA_CLOUD_BASIC_AUTH_HEADER: ${GRAFANA_CLOUD_BASIC_AUTH_HEADER}
    ports:
      - "4317:4317"
      - "4318:4318"
